[rule]
id = "missing_zorder"
code = "BD002"
severity = "info"
language = "sql"
description = "Large Delta table missing ZORDER optimization"
suggestion = "Add ZORDER BY on frequently filtered columns"
category = "Delta"
tags = ["delta", "performance", "sql"]
platform = "delta"

[context]
type = "missing_zorder"

[tests]
pass = [
    "OPTIMIZE events WHERE date >= '2024-01-01' ZORDER BY col1",
]
fail = [
    "OPTIMIZE events",
]

[graph]
detect = """
(fact:source @src
  (#match? @src "(?i)\\bOPTIMIZE\\b")
  (#not (#match? @src "(?i)\\bZORDER\\b")))
"""
