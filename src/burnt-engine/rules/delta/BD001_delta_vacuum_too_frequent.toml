[rule]
id = "delta_vacuum_too_frequent"
code = "BD001"
severity = "warning"
language = "sql"
description = "VACUUM called more frequently than needed"
suggestion = "Adjust vacuum retention based on table size and update frequency"
category = "Delta"
tags = ["delta", "maintenance", "sql"]
platform = "delta"

[query]
detect = """
(keyword_vacuum) @vac
"""

[tests]
pass = [
    "SELECT id FROM users WHERE status = 'active'",
    "OPTIMIZE my_table",
]
fail = [
    "VACUUM my_table",
    "VACUUM my_table RETAIN 168 HOURS",
]

[graph]
detect = """
(fact:source @src
  (#match? @src "(?i)\\bVACUUM\\b"))
"""
