[rule]
id = "magic_in_plain"
code = "BP003"
severity = "warning"
language = "python"
description = "Databricks magic (# MAGIC) in plain Python file"
suggestion = "Remove magic or use .py (Databricks) extension"
category = "BestPractice"
tags = ["python", "databricks", "magic"]
platform = "databricks"

[query]
detect = """
((comment) @c
 (#match? @c "^# MAGIC"))
"""

[tests]
pass = [
    "x = 1  # regular comment",
    "# This is a regular Python comment",
]
fail = [
    "# MAGIC run some_command",
    "# MAGIC sql SELECT * FROM table",
]

