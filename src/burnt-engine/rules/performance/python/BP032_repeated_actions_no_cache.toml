[rule]
id = "repeated_actions_no_cache"
code = "BP032"
severity = "warning"
language = "python"
description = "Same DataFrame has 2+ action calls without .cache() — plan executed multiple times"
suggestion = "Call .cache() before the first action and .unpersist() afterward"
category = "BestPractice"
tags = ["pyspark", "performance", "caching"]
platform = "all"

[tests]
pass = [
    "cached_df = df.cache()\nresult = cached_df.collect()\ncached_df.unpersist()",
]
fail = [
    "result = big_df.collect()\nresult = big_df.count()",
]


[graph]
detect = """
(fact:source @src
  (#match? @src "\\.(collect|count|first|take|toPandas)\\s*\\(")
  (#not (#match? @src "\\.cache\\s*\\(")))
"""
