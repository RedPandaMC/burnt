# BP008 - collect() without limit()
## Rule: BP008
## Description: collect() without limit() can OOM the driver
## Severity: error
## Category: Performance
## Tags: ["pyspark", "memory", "driver-bound"]

[rule]
id = "collect_without_limit"
code = "BP008"
severity = "error"
language = "python"
description = "collect() without limit() can OOM the driver"
suggestion = "Add .limit(n).collect() or use .take(n)"
category = "BestPractice"
tags = ["pyspark", "memory", "driver-bound"]
platform = "all"

[tests]
pass = [
    "df.limit(100).collect()",
    "df.take(10)",
]
fail = [
    "df.collect()",
]


[graph]
detect = """
(op:Action
  (ast/Call :method "collect" @call)
  (#not-receiver-of @call "limit")
  (#not-receiver-of @call "take"))
"""
