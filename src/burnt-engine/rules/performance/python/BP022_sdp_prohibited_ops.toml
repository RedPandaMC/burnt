[rule]
id = "sdp_prohibited_ops"
code = "BP022"
severity = "error"
language = "python"
description = "Prohibited operation inside Spark Declarative Pipeline function"
suggestion = "Remove this operation from SDP pipeline code"
category = "BestPractice"
tags = ["pyspark", "sdp", "dlt"]
platform = "databricks"

[tests]
pass = [
    "@sdp.table\ndef my_table():\n    return spark.read.table('source')",
    "spark.write.saveAsTable('output')",
]
fail = [
    "sdp.collect(df)",
    "sdp.table.show(df)",
]


[graph]
detect = """
(fact:source @src
  (#match? @src "\\bsdp\\.(?:collect|table\\.show)\\s*\\("))
"""
