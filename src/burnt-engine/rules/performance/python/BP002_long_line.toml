[rule]
id = "long_line"
code = "BP002"
severity = "info"
language = "python"
description = "Line exceeds 120 characters"
suggestion = "Break line for readability"
category = "BestPractice"
tags = ["python", "style", "readability"]
platform = "all"

[context]
type = "long_line"

[tests]
pass = [
    "x = 1  # short line",
    "result = df.filter(col('id') > 0).select('id', 'name', 'email').limit(100)",
]
fail = [
    "very_long_variable_name_that_exceeds_the_limit = some_function_call_with_many_arguments(argument_one, argument_two, argument_three, argument_four)",
]


[graph]
detect = """
(fact:source @src
  (#match? @src ".{121,}"))
"""
