# BP014 - CROSS JOIN (SQL and PySpark)
## Rule: BP014
## Description: CROSS JOIN creates O(n*m) rows
## Severity: warning
## Category: Performance
## Tags: ["pyspark", "join", "shuffle"]

[rule]
id = "cross_join"
code = "BP014"
severity = "warning"
language = "python"
description = "CROSS JOIN creates O(n*m) rows"
suggestion = "Use INNER JOIN with explicit ON clause"
category = "BestPractice"
tags = ["pyspark", "join", "shuffle"]
platform = "all"

[tests]
pass = [
    "df1.join(df2, 'id')",
    "df1.innerJoin(df2, 'id')",
]
fail = [
    "df1.crossJoin(df2)",
]


[graph]
detect = """
(op:Shuffle
  (ast/Call :method "crossJoin"))
"""
