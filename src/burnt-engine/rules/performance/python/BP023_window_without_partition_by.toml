[rule]
id = "window_without_partition_by"
code = "BP023"
severity = "warning"
language = "python"
description = "Window.orderBy() without .partitionBy() causes global sort"
suggestion = "Add .partitionBy() before .orderBy() or use .orderBy().limit()"
category = "BestPractice"
tags = ["pyspark", "window", "shuffle"]
platform = "all"

[tests]
pass = [
    "window_spec = Window.orderBy('date').partitionBy('user_id')",
    "w = Window.order_by('ts').partition_by('session_id')",
]
fail = [
    "window_spec = Window.orderBy('date')",
    "w = Window.order_by('timestamp')",
]


[graph]
detect = """
(fact:source @src
  (#match? @src "\\bWindow\\.(?:orderBy|order_by)\\s*\\(")
  (#not (#match? @src "(?:partitionBy|partition_by)")))
"""
