[rule]
id = "deprecated_magic"
code = "BP004"
severity = "warning"
language = "python"
description = "Deprecated Databricks magic syntax used"
suggestion = "Use new-style magic format"
category = "BestPractice"
tags = ["python", "databricks", "magic"]
platform = "databricks"

[query]
detect = """
((comment) @c
 (#match? @c "^# MAGIC (run|sql|md)( |$)"))
"""

[tests]
pass = [
    "# MAGIC %python",
    "# This is a normal comment",
]
fail = [
    "# MAGIC run some_command",
    "# MAGIC sql SELECT * FROM table",
    "# MAGIC md",
]


[graph]
detect = """
(fact:source @src
  (#match? @src "^# MAGIC (run|sql|md)( |$)"))
"""
