[rule]
id = "optimize_write_disabled"
code = "BC005"
severity = "warning"
language = "python"
description = "Disabling optimizeWrite causes small-file proliferation on high-churn Delta tables"
suggestion = "Remove this config or set it to true"
category = "Config"
tags = ["delta", "performance", "config"]
platform = "databricks"

[tests]
pass = [
    "spark.conf.set(\"spark.databricks.delta.optimizeWrite.enabled\", \"true\")",
]
fail = [
    "spark.conf.set(\"spark.databricks.delta.optimizeWrite.enabled\", \"false\")",
]

[graph]
detect = """
(op:Action
  (ast/Call :method "set" :arg/0 @k :arg/1 @v)
  (#eq? @k "spark.databricks.delta.optimizeWrite.enabled")
  (#eq? @v "false"))
"""
