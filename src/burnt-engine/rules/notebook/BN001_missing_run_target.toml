[rule]
id = "missing_run_target"
code = "BN001"
severity = "info"
language = "notebook"
description = "Notebook missing run directive or target"
suggestion = "Add a run directive or specify a target"
category = "Notebook"
tags = ["notebook", "structure"]
platform = "databricks"

[tests]
pass = [
    "# %run ./utils/helpers",
]
fail = [
    "df = spark.read.table('events')",
]

[graph]
detect = """
(fact:source @src
  (#not (#match? @src "%run\\b")))
"""
