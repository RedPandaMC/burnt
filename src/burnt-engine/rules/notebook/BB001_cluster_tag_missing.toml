[rule]
id = "cluster_tag_missing"
code = "BB001"
severity = "warning"
language = "notebook"
description = "Cluster tag missing from notebook configuration"
suggestion = "Add cluster tags for cost attribution"
category = "Notebook"
tags = ["notebook", "cost", "governance"]
platform = "databricks"

[tests]
pass = [
    "cluster_tags = {'team': 'data-eng', 'project': 'etl'}",
]
fail = [
    "spark.read.table('events')",
]

[graph]
detect = """
(fact:source @src
  (#not (#match? @src "cluster_tags")))
"""
