[rule]
id = "large_notebook"
code = "BP006"
severity = "info"
language = "notebook"
description = "Large notebook detected (>50 cells) - consider splitting"
suggestion = "Split into multiple notebooks for better maintainability"
category = "Notebook"
tags = ["notebook", "structure", "maintainability"]
platform = "all"

[tests]
pass = [
    "# %%\ncell1\n# %%\ncell2",
]
fail = [
    "# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n# %%\nc\n",
]

[graph]
detect = """
(fact:source @src
  (#match? @src "(?:[^\\n]*\\n){100,}"))
"""
