[rule]
id = "missing_cell_type"
code = "BP005"
severity = "info"
language = "notebook"
description = "Cell missing type declaration"
suggestion = "Add cell type (python, sql, or markdown)"
category = "Notebook"
tags = ["notebook", "style", "structure"]
platform = "databricks"

[tests]
pass = [
    "# %python\ndf = spark.read.table('events')",
]
fail = [
    "# %%\ndf = spark.read.table('events')",
]

[graph]
detect = """
(fact:source @src
  (#match? @src "#\\s*%%[^\\n]*\\n[^#\\n]"))
"""
