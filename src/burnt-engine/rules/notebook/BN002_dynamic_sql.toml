[rule]
id = "dynamic_sql"
code = "BN002"
severity = "warning"
language = "notebook"
description = "Dynamic SQL construction detected - potential SQL injection risk"
suggestion = "Use parameterized queries instead of string concatenation"
category = "Notebook"
tags = ["notebook", "security", "sql"]
platform = "databricks"

[tests]
pass = [
    "spark.sql('SELECT * FROM events WHERE date = :date')",
]
fail = [
    "spark.sql(f'SELECT * FROM events WHERE date = {date}')",
    "spark.sql('SELECT * FROM ' + table_name)",
]

[graph]
detect = """
(fact:source @src
  (#or
    (#match? @src "spark\\.sql\\s*\\(\\s*f")
    (#match? @src "spark\\.sql\\s*\\([^)]*\\+")))
"""
