[rule]
id = "no_markdown"
code = "BP007"
severity = "info"
language = "notebook"
description = "Notebook has no markdown cells for documentation"
suggestion = "Add markdown cells to document your notebook"
category = "Notebook"
tags = ["notebook", "style", "documentation"]
platform = "all"

[context]
type = "no_markdown"

[tests]
pass = [
    "# %md\n## My Section\nThis notebook loads data.",
]
fail = [
    "df = spark.read.table('events')\ndf.show()",
]

[graph]
detect = """
(fact:source @src
  (#not (#match? @src "(?:%md|# MAGIC %md)")))
"""
