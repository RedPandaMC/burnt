[rule]
id = "circular_run"
code = "BN003"
severity = "error"
language = "notebook"
description = "Circular run directive detected - notebook would call itself"
suggestion = "Remove the circular reference"
category = "Notebook"
tags = ["notebook", "structure", "correctness"]
platform = "databricks"

[context]
type = "circular_run"

[tests]
pass = [
    "# %run ./utils/helpers",
]
fail = [
    "dbutils.notebook.run('./current_notebook')",
]

[graph]
detect = """
(fact:source @src
  (#match? @src "dbutils\\.notebook\\.run\\s*\\("))
"""
