[rule]
id = "cross_join"
code = "SQ002"
severity = "warning"
language = "sql"
description = "CROSS JOIN without explicit condition"
suggestion = "Use INNER JOIN with explicit condition"
category = "SqlQuality"
tags = ["sql", "join", "cartesian"]
platform = "all"

[graph]
detect = """
(fact:source @src
  (#match? @src "(?i)\\bCROSS\\s+JOIN\\b"))
"""
