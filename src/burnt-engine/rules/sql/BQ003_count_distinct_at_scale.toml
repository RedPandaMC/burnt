[rule]
id = "count_distinct_at_scale"
code = "BQ003"
severity = "info"
language = "sql"
description = "COUNT(DISTINCT col) requires full shuffle and sort — expensive at scale"
suggestion = "Consider approx_count_distinct() for large datasets where exact count is not required"
category = "SqlQuality"
tags = ["sql", "performance", "aggregation"]
platform = "all"

[tests]
pass = [
    "SELECT COUNT(id) FROM users",
    "SELECT approx_count_distinct(id) FROM users",
]
fail = [
    "SELECT COUNT(DISTINCT id) FROM users",
    "SELECT count(distinct id) FROM users",
]

[graph]
detect = """
(fact:source @src
  (#match? @src "(?i)\\bCOUNT\\s*\\(\\s*DISTINCT\\b"))
"""
