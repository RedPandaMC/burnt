[rule]
id = "correlated_subquery"
code = "BQ004"
severity = "error"
language = "sql"
description = "Correlated subquery references outer columns — Spark may execute as a nested loop join"
suggestion = "Rewrite as a join or use window functions"
category = "SqlQuality"
tags = ["sql", "performance", "subquery"]

[query]
detect = """
(binary_expression
  (not_in)
  (subquery) @inner)
"""

[tests]
pass = [
    "SELECT id FROM users WHERE status = 'active'",
    "SELECT id FROM users WHERE id IN (1, 2, 3)",
]
fail = [
    "SELECT * FROM a WHERE id NOT IN (SELECT id FROM b)",
    "SELECT id FROM orders WHERE customer_id NOT IN (SELECT id FROM customers)",
]
