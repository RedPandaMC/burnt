[rule]
id = "df_bracket_or_dot_reference"
code = "BNT-C01"
severity = "warning"
language = "python"
description = "df['col'] or df.col outside a join can cause stale reference bugs after withColumn"
suggestion = "Use F.col('col') which resolves at evaluation time"
category = "NotebookStyle"
tags = ["python", "style", "correctness"]
platform = "all"

[tests]
pass = [
    "result = F.col('column')",
    "result = col('column')",
    "items = my_list['key']",
]
fail = [
    "val = df['column']",
    "val = df[\"column\"]",
    "val = df1['column']",
]

[graph]
detect = """
(fact:source @src
  (#match? @src "\\bdf\\d*\\s*\\[\\s*[a-zA-Z_'\\x22]"))
"""
