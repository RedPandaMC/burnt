[rule]
id = "star_import_pyspark_functions"
code = "BNT-I01"
severity = "error"
language = "python"
description = "from pyspark.sql.functions import * shadows Python built-ins (max, min, sum, map, round)"
suggestion = "Use: from pyspark.sql import functions as F"
category = "NotebookStyle"
tags = ["python", "import", "style"]
platform = "all"

[query]
detect = """
(import_from_statement
  (dotted_name) @mod
  (wildcard_import)
  (#match? @mod "pyspark"))
"""

[tests]
pass = [
    "from pyspark.sql import functions as F",
    "from pyspark import SparkContext",
    "import pyspark",
]
fail = [
    "from pyspark.sql.functions import *",
]

[graph]
detect = """
(fact:source @src
  (#match? @src "from\\s+pyspark[^\\n]*\\bimport\\s+\\*"))
"""
