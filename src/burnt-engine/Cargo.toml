[package]
name = "burnt-engine"
version = "0.2.0"
edition = "2021"
description = "Rust engine for burnt cost estimation"
readme = "README.md"
license = "GPL-3.0-or-later"

[lib]
name = "_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310"] }
strum = { version = "0.26", features = ["derive"] }
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-sequel = "0.3"
sqlparser = { version = "0.60", features = ["visitor"] }
toml = "0.8"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
bitflags = { version = "2.6", features = ["serde"] }
regex = "1.10"

[dev-dependencies]
tempfile = "3.14"
insta = { version = "1.40", features = ["json", "yaml"] }

[build-dependencies]
pyo3-build-config = "0.22"
toml = "0.8"

[[test]]
name = "test_pattern_rules"
path = "../../tests/unit/rules/test_pattern_rules.rs"

[[test]]
name = "test_context_rules"
path = "../../tests/unit/rules/test_context_rules.rs"

[[test]]
name = "test_dataflow_rules"
path = "../../tests/unit/rules/test_dataflow_rules.rs"

[[test]]
name = "resolved_graph"
path = "tests/resolved_graph.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true